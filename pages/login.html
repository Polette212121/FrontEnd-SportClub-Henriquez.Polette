<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SportClub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body class="form-page">
    <div class="form-container">
        <div class="form-card">
            <div class="form-header">
                <h1>SportClub</h1>
                <p>Tu mejor versión comienza hoy</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="tu@correo.com" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña <span class="required">*</span></label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block w-100">Ingresar</button>
                </div>

                <div class="form-links">
                    <a href="recuperar-contrasena.html" class="link">¿Olvidaste tu contraseña?</a>
                    <span class="divider">|</span>
                    <a href="registro.html" class="link">Crear cuenta</a>
                </div>

                <div class="success-message" id="successMessage"></div>
            </form>

            <div class="form-footer">
                <a href="../index.html" class="link">← Volver al inicio</a>
            </div>
        </div>
    </div>

    <script src="../js/forms.js"></script>
</body>
</html>
