<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .form-container {
            max-width: 400px;
            width: 100%;
            margin: 20px;
        }
        .form-title {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-title h2 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .form-title p {
            color: #666;
            margin: 0;
        }
        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .form-footer a {
            color: #007bff;
            text-decoration: none;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-login:hover {
            background-color: #0056b3;
        }
        .btn-login:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .back-link {
            margin-top: 15px;
            text-align: center;
        }
        .back-link a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="form-container">
            <div class="form-title">
                <h2>SportClub</h2>
                <p>Iniciar Sesión</p>
            </div>

            <div id="messageContainer"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    <div class="form-error"></div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                    <div class="form-error"></div>
                </div>

                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>

            <div class="form-footer">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>

            <div class="back-link">
                <a href="../index.html">← Volver a inicio</a>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const messageContainer = document.getElementById('messageContainer');

        // Redirect if already logged in
        if (isLoggedIn()) {
            window.location.href = 'dashboard.html';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validate
            let isValid = true;
            const emailField = document.getElementById('email');
            const passwordField = document.getElementById('password');

            clearFieldError(emailField);
            clearFieldError(passwordField);

            if (!email) {
                showFieldError(emailField, 'El email es obligatorio');
                isValid = false;
            } else if (!validateEmail(email)) {
                showFieldError(emailField, 'Email inválido');
                isValid = false;
            }

            if (!password) {
                showFieldError(passwordField, 'La contraseña es obligatoria');
                isValid = false;
            }

            if (!isValid) return;

            // Submit
            const button = form.querySelector('button[type="submit"]');
            showLoading(button);

            try {
                const result = await authAPI.login(email, password);

                if (result.ok) {
                    showMessage(messageContainer, 'Inicio de sesión exitoso', 'success');
                    setTimeout(() => {
                        const user = getCurrentUser();
                        if (user.role === 'admin') {
                            window.location.href = 'admin-users.html';
                        } else if (user.role === 'coach') {
                            window.location.href = 'dashboard.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 1000);
                } else {
                    showMessage(messageContainer, result.data.message || 'Error al iniciar sesión', 'error');
                    hideLoading(button, 'Iniciar Sesión');
                }
            } catch (error) {
                showMessage(messageContainer, 'Error de conexión', 'error');
                hideLoading(button, 'Iniciar Sesión');
            }
        });
    </script>
</body>
</html>
