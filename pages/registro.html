<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SportClub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body class="form-page">
    <div class="form-container">
        <div class="form-card">
            <div class="form-header">
                <h1>SportClub</h1>
                <p>Únete a nuestra comunidad</p>
            </div>

            <form class="registro-form" id="registroForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo <span class="required">*</span></label>
                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Tu nombre completo" required>
                    <span class="error-message" id="nombreError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="tu@correo.com" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña <span class="required">*</span></label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    <small class="form-text">Mínimo 8 caracteres</small>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña <span class="required">*</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="dateOfBirth">Fecha de Nacimiento</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth" class="form-control">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block w-100">Registrarse</button>
                </div>

                <div class="success-message" id="successMessage"></div>
            </form>

            <div class="form-links">
                <a href="login.html" class="link">← Iniciar Sesión</a>
            </div>

            <div class="form-footer">
                <a href="../index.html" class="link">Ir al inicio</a>
            </div>
        </div>
    </div>

    <script src="../js/forms.js"></script>
</body>
</html>
